<head>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone">
      <div class="island" aria-hidden="true"></div>
      <div class="screen" id="screen" data-tone="light">
        <header class="statusbar" id="statusbar" aria-hidden="true">
          <span class="sb-time" data-clock></span>
          <span class="sb-icons">
            <svg viewBox="0 0 18 12" class="sb-signal"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" class="sb-wifi"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0Z"/><path d="M3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.4 1.4a4.5 4.5 0 0 0-6.4 0Z"/><path d="M1.1 4.5a9.8 9.8 0 0 1 13.8 0l-1.4 1.4a7.8 7.8 0 0 0-11 0Z"/></svg>
            <span class="sb-batt"><span class="sb-batt-level"></span></span>
          </span>
        </header>

        <section class="home" id="home" aria-label="Home screen"></section>
        <div class="windows" id="windows"></div>
        <button class="homebar" id="homebar" aria-label="Go home"><span></span></button>

        <section class="lock" id="lock" aria-label="Lock screen">
          <div class="lock-top">
            <svg class="lock-padlock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0 1 10 0V10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="10" width="14" height="11" rx="3" fill="currentColor"/></svg>
            <div class="lock-date" data-date></div>
            <div class="lock-time" data-clock></div>
            <p class="lock-caption">You found Ahmed’s phone. Have a look around.</p>
          </div>
          <div class="lock-notifs" id="lockNotifs"></div>
          <div class="lock-bottom">
            <span class="lock-hint">Swipe up to open</span>
          </div>
        </section>
      </div>
    </div>
    <p class="stage-note">Best on your phone · <span class="kbd">Esc</span> goes home</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
